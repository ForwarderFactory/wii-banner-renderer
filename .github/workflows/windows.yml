name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-ffmpeg
          mingw-w64-x86_64-glew

    - name: Build
      shell: msys2 {0}
      run: |
        mkdir -p build
        cd build
        cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build .
        
        for dll in $(ldd wbr.exe | awk '/mingw|ucrt|clang/ { print $3 }' | sort -u); do
          if [ -n "$dll" ] && [ -f "$dll" ]; then
            cp "$dll" .
          fi
        done

    - name: Create ZIP
      shell: powershell
      run: |
        Compress-Archive -Path build\wbr.exe, build\wbp.exe, build\*.dll build\wb.a -DestinationPath release.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: release.zip
