
name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-ffmpeg
          mingw-w64-x86_64-glew

    - name: Build
      shell: msys2 {0}
      run: |
        mkdir -p build
        cd build
        cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build . --parallel

        for exe in wbr.exe wbp.exe; do
          if [ ! -f "$exe" ]; then
            echo "Error: $exe was not built"
            exit 1
          fi

          for dll in $(ldd "$exe" | awk '/mingw|ucrt|clang/ { print $3 }' | sort -u); do
            if [ -n "$dll" ] && [ -f "$dll" ]; then
              cp -n "$dll" .
            fi
          done
        done

    - name: Upload wbr
      uses: actions/upload-artifact@v4
      with:
        name: wbr-windows-x64
        path: |
          build/wbr.exe
          build/*.dll
        if-no-files-found: error
        compression-level: 0

    - name: Upload wbp
      uses: actions/upload-artifact@v4
      with:
        name: wbp-windows-x64
        path: |
          build/wbp.exe
          build/*.dll
        if-no-files-found: error
        compression-level: 0

    - name: Upload development library
      uses: actions/upload-artifact@v4
      with:
        name: wb-library-windows-x64
        path: |
          build/libwb.a
          include/
        if-no-files-found: error
        compression-level: 6
